version: '3'

vars:
  CORE: vendor/mgba_libretro.dylib
  GPSP_HOST: vendor/gpsp_libretro.dylib
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7
  GPSP_COMMIT: 7b2dd37394e2822110cacef321e9bb291a305b77
  BRICK_GLIBC: '2.31'
  BRICK_TARGET: aarch64-unknown-linux-gnu
  BRICK_BIN: target-device/aarch64-unknown-linux-gnu/device/slot
  CROSS: >-
    BRICK_GLIBC={{.BRICK_GLIBC}}
    SLOT_CROSS_CC=$PWD/tools/zig/aarch64-cc SLOT_CROSS_CXX=$PWD/tools/zig/aarch64-c++
    SLOT_CROSS_AR=$PWD/tools/zig/aarch64-ar SLOT_CROSS_RANLIB=$PWD/tools/zig/aarch64-ranlib

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace

  release:
    desc: Release build of the slot binary
    cmds:
      - cargo build --release -p slot

  test:
    desc: Run the whole test suite
    cmds:
      - cargo test --workspace --lib --bins --tests

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [FILTER]
    cmds:
      - cargo test --workspace --lib --bins --tests {{.FILTER}}

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --lib --bins --tests -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      - cargo clippy -p slot --no-default-features --features device -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test
      - task: test:card

  test:card:
    desc: Test the scripts slot ships on the card, off-device
    cmds:
      - sh card/test-slotlink.sh
      - sh card/test-coresave.sh
      - sh card/test-launch.sh
      - sh card/test-boot.sh
      - sh card/test-suspend.sh

  core:
    desc: >-
      Build mGBA and fetch gpSP for this host. A missing core silently runs the mock (a test
      pattern and a sine tone) instead
    cmds:
      - task: core:mgba:host
      - task: core:gpsp:host

  core:mgba:host:
    desc: Build mgba_libretro for this host from the pinned libretro/mgba commit and cores/mgba's patches
    status:
      - test -f {{.CORE}}
      - test "$(cat {{.CORE}}.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target/mgba {{.CORE}}
      - file {{.CORE}} | grep -q Mach-O
      - 'echo "built {{.CORE}}"'

  core:gpsp:host:
    desc: Fetch the host gpSP core from the libretro buildbot
    status:
      - test -f {{.GPSP_HOST}}
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/gpsp-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/gpsp_libretro.dylib.zip"
        unzip -o -q vendor/gpsp-host.zip -d vendor
        rm -f vendor/gpsp-host.zip
        file {{.GPSP_HOST}} | grep -q Mach-O
        echo "fetched {{.GPSP_HOST}}"

  core:update:
    desc: Rebuild mGBA and re-fetch gpSP for this host even if they are already vendored
    cmds:
      - rm -f {{.CORE}} {{.CORE}}.meta {{.GPSP_HOST}}
      - task: core

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/slot-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  sdcard:
    desc: Create an empty content root, ROOT defaults to ./sdcard
    deps: [build]
    vars:
      ROOT: '{{.ROOT | default "./sdcard"}}'
    cmds:
      - ./target/debug/slot --init-root {{.ROOT}}
      - 'echo "content root ready at {{.ROOT}}: roms in Games/GBA, Games/GB or Games/GBC, labels in the matching Labels/GBA, Labels/GB or Labels/GBC, battery saves in the matching Saves/GBA, Saves/GB or Saves/GBC, save states under the matching States/GBA, States/GB or States/GBC, gba_bios.bin in BIOS, pngs in Wallpapers, palette in Config/theme.txt"'
      - 'echo "nothing is moved for you: a file loose at the top of Games/, Saves/, Labels/ or States/ is left where it is and never reaches the shelf"'

  run:
    desc: >-
      Run slot. against SLOT_ROOT, defaults to ./sdcard. SLOT_LINK_PORT moves the link
      session off 7211, which is what lets two copies on one machine link to each other -
      off-device both are on loopback, so the port is all that separates them
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run --release -p slot

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_BARE: '1'
    cmds:
      - cargo run --release -p slot

  run:4x3:
    desc: Run in a 4:3 window, as on the RG35XXSP, with the bezel around the screen
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_WINDOW: '1280x960'
    cmds:
      - cargo run --release -p slot

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run -p slot

  build:device:
    desc: Build slot for the TrimUI Brick with cargo-zigbuild, against glibc {{.BRICK_GLIBC}}
    cmds:
      - >-
        cargo zigbuild --profile device --target-dir target-device
        --target {{.BRICK_TARGET}}.{{.BRICK_GLIBC}}
        -p slot --no-default-features --features device
      - file {{.BRICK_BIN}} | grep -q aarch64
      - sh tools/glibc-floor.sh {{.BRICK_BIN}} {{.BRICK_GLIBC}}

  core:device:
    desc: Cross-build the mGBA core for the Brick with zig
    status:
      - test -f vendor/brick/mgba_libretro.so
      - test "$(cat vendor/brick/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - '{{.CROSS}} sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target-device/mgba vendor/brick/mgba_libretro.so'
      - file vendor/brick/mgba_libretro.so | grep -q aarch64
      - sh tools/glibc-floor.sh vendor/brick/mgba_libretro.so {{.BRICK_GLIBC}}

  core:gpsp:
    desc: >-
      Cross-build the gpSP core for the Brick from its pinned source archive, which ships beside it
      as its GPL-2.0 section 3(a) corresponding source
    status:
      - test -f vendor/brick/gpsp_libretro.so
      - test -f vendor/gpsp-src.tar.gz
      - test "$(cat vendor/gpsp-src.sha 2>/dev/null)" = "{{.GPSP_COMMIT}}"
      - test "$(cat vendor/brick/gpsp_libretro.so.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/brick/gpsp_libretro.so vendor/brick/gpsp_libretro.so.meta vendor/gpsp-src.tar.gz vendor/gpsp-src.sha vendor/gpsp-src.meta
        curl -fsSL -o vendor/gpsp-src.tar.gz "https://github.com/libretro/gpsp/archive/{{.GPSP_COMMIT}}.tar.gz"
        tar -tzf vendor/gpsp-src.tar.gz | grep "^gpsp-{{.GPSP_COMMIT}}/Makefile$" > /dev/null
      - '{{.CROSS}} sh cores/gpsp/build.sh build {{.GPSP_COMMIT}} vendor/gpsp-src.tar.gz target-device/gpsp vendor/brick/gpsp_libretro.so'
      - file vendor/brick/gpsp_libretro.so | grep -q aarch64
      - sh tools/glibc-floor.sh vendor/brick/gpsp_libretro.so {{.BRICK_GLIBC}}
      - echo "{{.GPSP_COMMIT}}" > vendor/gpsp-src.sha
      - cp vendor/brick/gpsp_libretro.so.meta vendor/gpsp-src.meta

  core:gpsp:update:
    desc: Refetch gpSP's source archive and rebuild the core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/brick/gpsp_libretro.so vendor/brick/gpsp_libretro.so.meta vendor/gpsp-src.tar.gz
        vendor/gpsp-src.sha vendor/gpsp-src.meta
      - task: core:gpsp

  core:gpsp:test:
    desc: Prove gpSP's Advance Wars session-flip patch still fixes what it was written for
    deps: [core:gpsp]
    cmds:
      - sh cores/gpsp/test/run.sh vendor/gpsp-src.tar.gz

  bench:device:
    desc: Build core_bench for the Brick. It never ships
    cmds:
      - >-
        cargo zigbuild --profile device --target-dir target-device
        --target {{.BRICK_TARGET}}.{{.BRICK_GLIBC}} -p slot-retro --example core_bench

  dist:device:
    desc: Build the Brick SD tree, OUT defaults to ./dist-brick. Copy its contents to the SD card root
    deps: [core:device, core:gpsp, build:device]
    vars:
      OUT: '{{.OUT | default "dist-brick"}}'
    cmds:
      - rm -rf {{.OUT}}
      - cargo run -q -p slot -- --init-sd {{.OUT}}
      - mkdir -p {{.OUT}}/Apps/Slot
      - cp -R card/Apps/Slot/. {{.OUT}}/Apps/Slot/
      - cp {{.BRICK_BIN}} {{.OUT}}/Apps/Slot/slot
      - cp vendor/brick/mgba_libretro.so vendor/brick/gpsp_libretro.so {{.OUT}}/Apps/Slot/
      - cp -r licenses {{.OUT}}/Apps/Slot/licenses
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        cp vendor/gpsp-src.tar.gz "{{.OUT}}/Apps/Slot/licenses/gpsp-${sha}.tar.gz"
        cp vendor/gpsp-src.meta "{{.OUT}}/Apps/Slot/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do cp "$p" "{{.OUT}}/Apps/Slot/licenses/gpsp-$(basename "$p")"; done
        commit="$(grep '^commit=' vendor/brick/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/brick/mgba_libretro.so.meta "{{.OUT}}/Apps/Slot/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do cp "$p" "{{.OUT}}/Apps/Slot/licenses/mgba-$(basename "$p")"; done
      - 'echo "Brick tree ready at {{.OUT}}: copy Apps/ and Slot/ to the root of the SD card"'

  deploy:device:
    desc: Push the Brick build over SSH. BRICK=root@<ip>; BrickTools' SSH password is tina
    requires:
      vars: [BRICK]
    deps: [dist:device]
    cmds:
      - >-
        tar -C dist-brick -cf - Apps/Slot | ssh {{.BRICK}}
        'tar -C /mnt/SDCARD -xf - && chmod +x /mnt/SDCARD/Apps/Slot/slot /mnt/SDCARD/Apps/Slot/*.sh
        /mnt/SDCARD/Apps/Slot/boot/*.sh && mkdir -p /mnt/SDCARD/Slot && sync'
      - 'echo "deployed; open Apps > Slot on the Brick, then task log:device BRICK={{.BRICK}}"'

  deploy:adb:
    desc: Push the Brick build over adb
    deps: [dist:device]
    cmds:
      - adb wait-for-device
      - adb push dist-brick/Apps/Slot /mnt/SDCARD/Apps/
      - adb shell 'chmod +x /mnt/SDCARD/Apps/Slot/slot /mnt/SDCARD/Apps/Slot/*.sh /mnt/SDCARD/Apps/Slot/boot/*.sh; mkdir -p /mnt/SDCARD/Slot; sync'

  log:device:
    desc: Read slot's log back off the Brick
    requires:
      vars: [BRICK]
    cmds:
      - ssh {{.BRICK}} 'cat /mnt/SDCARD/Slot/slot.log'

  sdcard:brick:
    desc: Make a StockMix-shaped card at ./sdcard-brick for running on this machine
    deps: [build]
    cmds:
      - ./target/debug/slot --init-sd ./sdcard-brick
      - mkdir -p sdcard-brick/Roms/GBA sdcard-brick/Roms/GB sdcard-brick/Roms/GBC sdcard-brick/BIOS
      - 'echo "put roms in sdcard-brick/Roms/<GBA|GB|GBC>, then task run:brick"'

  run:brick:
    desc: >-
      Run slot on this machine against ./sdcard-brick, laid out like a StockMix card. The host core
      tasks build macOS dylibs, so on Linux this runs the mock core (a test pattern and a tone)
    env:
      SLOT_SD: ./sdcard-brick
      SLOT_APP: ./card/Apps/Slot
      SLOT_WINDOW: '1024x768'
    cmds:
      - cargo run --release -p slot

  clean:
    desc: Remove build output and dist
    cmds:
      - cargo clean
      - rm -rf dist-brick sdcard-brick target-device
